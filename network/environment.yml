# Create with:   conda env create -f environment.yml
# Activate with: conda activate synlife
#
# Also required from the system (not installable via pip):
#   - a C++ compiler (g++), used by Brian2's cpp_standalone device
#   - LaTeX with the tgheros, sansmath and siunitx packages, used by the figures
#
# Versions are the ones the code was tested with (Python 3.12, Oct 2026).
name: synlife
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
    - brian2==2.10.1
    - pypet==0.7.0
    - tables==3.11.1        # HDF5 storage backend of pypet
    - h5py==3.16.0
    - numpy==2.5.4
    - scipy==1.18.1
    - pandas==3.1.0
    - matplotlib==3.11.2
    - powerlaw==2.0.0
    - mrestimator==0.2.0
    - gitpython==3.2.1
    - pytest==9.1.1
